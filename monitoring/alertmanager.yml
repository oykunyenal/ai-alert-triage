# All alerts go to the n8n webhook over the internal network (not exposed).
route:
  receiver: n8n
  group_by: [alertname, host]
  group_wait: 10s   # short for the demo
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: n8n
    webhook_configs:
      - url: http://n8n:5678/webhook/alerts
        send_resolved: true
